name: Build & Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Build & Publish APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: 📱 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: ⚙️ Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Gradle Signing for Release APK
        working-directory: android
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' app/build.gradle || true

      - name: 🔨 Build Android APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon || ./gradlew assembleDebug --no-daemon

      - name: 📂 Prepare Output APK
        run: |
          mkdir -p build-output
          find android/app/build/outputs/apk/ -name "*.apk" -exec cp {} build-output/RailOne-Release.apk \;

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RailOne-APK
          path: build-output/*.apk
          retention-days: 14

      - name: 🏷️ Generate Release Tag Name
        id: tag_name
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "TAG=v1.0.${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: 🚀 Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_name.outputs.TAG }}
          name: RailOne ${{ steps.tag_name.outputs.TAG }}
          body: |
            ## 🚀 RailOne App Auto-Build (${{ steps.tag_name.outputs.TAG }})
            
            ### ✨ Highlights:
            - Automated In-App OTA ready build
            - Commit: `${{ github.sha }}`
            - Branch: `${{ github.ref_name }}`
            
            ### 📥 Download & Install:
            Download the `RailOne-Release.apk` attached below directly to your phone.
          draft: false
          prerelease: false
          files: build-output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

